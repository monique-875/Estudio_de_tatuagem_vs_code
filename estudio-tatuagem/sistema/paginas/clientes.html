<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Clientes — Estúdio de Tatuagem</title>
</head>
<body>
  <h1>Clientes</h1>

  <form>
    <label for="busca">Buscar por nome, telefone ou e-mail:</label>
    <input id="busca" name="busca" type="search">
    <button type="submit">Buscar</button>
  </form>

  <h2>Cadastrar cliente</h2>
  <form>
    <label>Nome: <input name="nome" required></label><br><br>
    <label>CPF: <input name="cpf" required></label><br><br>
    <label>Telefone: <input name="telefone" required></label><br><br>
    <label>E-mail: <input name="email" type="email" required></label><br><br>
    <button type="submit">Salvar cliente</button>
  </form>

  <p><a href="/principal">Voltar ao painel</a></p>
</body>
</html>
